# ESP32-S3-DevKitC-1 N16R8: 8 MB octal PSRAM. OpenThread and the CLI live in
# PSRAM; internal DRAM is too small for them next to the Wi-Fi stack.
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL_BACKEND_SERIAL=y

CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=524288
CONFIG_ESP_SPIRAM_BSS_RELOC_LIBS_AND_OBJS="libopenthread-ftd.a libopenthread-cli-ftd.a"

# Match the conservative 8 MB DTS flash map and flashing argument.
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y
